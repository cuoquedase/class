<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 차시별 완성 활동지 조회</title>

    <style>
        /* 나눔스퀘어라운드 웹폰트 */
        @import url("https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css");

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'NanumSquareRound', sans-serif;
            font-weight: 400;
            overflow: hidden;
        }

        button, input, textarea {
            font-family: 'NanumSquareRound', sans-serif;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 학습지 영역 */
        .worksheet-area {
            flex: 1.2;
            min-width: 0;
            border-right: 3px solid #000;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .worksheet-area iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 오른쪽 조회 영역 */
        .search-area {
            flex: 0.8;
            min-width: 0;
            padding: 25px;
            overflow-y: auto;
            background: white;
            display: flex;
            flex-direction: column;
        }

        /* 제출 페이지 이동 버튼 */
        .nav-btn {
            align-self: flex-end;
            padding: 10px 16px;
            background: #f0fff0;
            border: 2px solid #000;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            margin-bottom: 10px;
        }

        .nav-btn:hover {
            background: #e8f5e8;
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #000;
        }

        h2 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 20px;
        }

        /* 본인 확인 입력 카드 */
        .search-box {
            background: white;
            padding: 20px;
            border: 2px solid #000;
            border-radius: 12px;
            box-shadow: 6px 6px 0 #000;
            margin-bottom: 25px;
        }

        .box-title {
            display: block;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        /* 항목명 왼쪽, 입력창 오른쪽 */
        .form-row {
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            margin-bottom: 13px;
        }

        .form-row label {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .form-row input {
            width: 100%;
            min-width: 0;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: #fff;
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
        }

        .form-row input:focus {
            border-color: #000;
            background: #fffdec;
        }

        /* 비밀번호 보기/숨기기 */
        .pw-container {
            position: relative;
            width: 100%;
        }

        .pw-container input {
            padding-right: 48px;
        }

        .toggle-pw {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #eee;
            margin: 22px 0 18px;
        }

        /* 조회 버튼 */
        .search-btn {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .search-btn:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .notice {
            color: #777;
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.7;
            margin-top: 14px;
        }

        /* 제출 현황 */
        .summary-box {
            background: #f0fff0;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .summary-title {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .summary-count {
            margin-top: 8px;
            white-space: pre-line;
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* 질문 및 답안 카드 */
        .result-item {
            background: #fffdf0;
            border: 1px dashed #999;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            line-height: 1.7;
        }

        /* 질문 번호 */
        .q-no {
            font-size: 0.95rem;
            font-weight: 800;
            color: #d35400;
            margin-bottom: 8px;
        }

        /* 질문 원문 */
        .question-text {
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.75;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #ddd;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .answer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .answer-label {
            color: #555;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* 답안 제출 상태 */
        .status {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 5px;
        }

        .status.complete {
            background: #def5e1;
            color: #166b30;
        }

        .status.missing {
            background: #eee;
            color: #777;
        }

        .status.warning {
            background: #fff0d7;
            color: #a34b00;
        }

        /* 최신 답안 */
        .answer-content {
            background: white;
            padding: 14px;
            border: 1px solid #eee;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.85;
        }

        .answer-content.empty {
            color: #999;
            background: #f7f7f7;
        }

        /* 최종 제출 시각 */
        .submit-time {
            text-align: right;
            color: #666;
            font-size: 0.82rem;
            font-weight: 400;
            margin-top: 10px;
        }

        /* 이전 답안 드롭다운 */
        .history-details {
            margin-top: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            overflow: hidden;
        }

        .history-details summary {
            padding: 13px;
            background: #f5f5f5;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .history-details summary:hover {
            background: #ebebeb;
        }

        .history-details[open] summary {
            border-bottom: 1px solid #ddd;
        }

        .history-list {
            padding: 12px;
        }

        .history-item {
            padding: 12px 5px;
            border-bottom: 1px solid #e5e5e5;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-date {
            color: #666;
            font-size: 0.82rem;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .history-content {
            background: #f8f8f8;
            padding: 12px;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.8;
        }

        /* 안내 및 오류 메시지 */
        .message {
            text-align: center;
            padding: 20px 10px;
            color: #777;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .message.error {
            color: #bd3333;
        }

        /* 모바일 화면 */
        @media (max-width: 850px) {
            html, body {
                overflow: auto;
            }

            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .worksheet-area {
                flex: none;
                height: 35vh;
                border-right: none;
                border-bottom: 3px solid #000;
            }

            .search-area {
                flex: none;
                overflow: visible;
                padding: 18px;
            }

            .form-row {
                grid-template-columns: 75px minmax(0, 1fr);
                gap: 8px;
            }
        }

        @media (max-width: 380px) {
            .form-row {
                grid-template-columns: 70px minmax(0, 1fr);
                gap: 6px;
            }

            .form-row label {
                font-size: 0.9rem;
            }

            .search-box {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="main-container">

    <!-- 왼쪽: 기존 학습지 -->
    <div class="worksheet-area">
        <iframe
            title="2학년 학습지"
            src="https://docs.google.com/document/d/e/2PACX-1vS0fvhPPwZcCbgQAXvjjTEv7R6ds_h5-HLgN9y0tS7w5RGDtWe8ZzWaBtSTCMBJBKU2-42iVqq9nlo7/pub?embedded=true">
        </iframe>
    </div>

    <!-- 오른쪽: 조회 화면 -->
    <div class="search-area">

        <button
            type="button"
            class="nav-btn"
            onclick="location.href='textpaper.html'">
            ✍️ 활동지 제출하러 가기
        </button>

        <h2>📚 차시별 완성 활동지 조회</h2>

        <form class="search-box" id="searchForm">

            <span class="box-title">👤 본인 확인</span>

            <div class="form-row">
                <label for="class">학반</label>
                <input
                    type="number"
                    id="class"
                    min="1"
                    max="10"
                    placeholder="반 입력"
                    required>
            </div>

            <div class="form-row">
                <label for="num">번호</label>
                <input
                    type="number"
                    id="num"
                    min="1"
                    max="50"
                    placeholder="번호 입력"
                    required>
            </div>

            <div class="form-row">
                <label for="name">이름</label>
                <input
                    type="text"
                    id="name"
                    placeholder="이름 입력"
                    pattern="^[ㄱ-ㅎㅏ-ㅣ가-힣]+$"
                    required>
            </div>

            <div class="form-row">
                <label for="pw">비밀번호</label>

                <div class="pw-container">
                    <input
                        type="password"
                        id="pw"
                        placeholder="비밀번호 입력"
                        pattern="^[a-z0-9]+$"
                        autocomplete="off"
                        required>

                    <button
                        type="button"
                        class="toggle-pw"
                        onclick="togglePassword()"
                        aria-label="비밀번호 보이기">
                        👁️
                    </button>
                </div>
            </div>

            <hr class="section-divider">

            <span class="box-title">📝 조회할 활동지</span>

            <div class="form-row">
                <label for="period">차시</label>
                <input
                    type="number"
                    id="period"
                    min="1"
                    placeholder="조회할 차시 입력"
                    required>
            </div>

            <button
                type="submit"
                class="search-btn"
                id="searchButton">
                차시별 완성 활동지 불러오기
            </button>

            <div class="notice">
                ※ 질문 내용은 스프레드시트의 '질문' 시트와
                자동 연동됩니다.
                각 문항의 최신 답안과 제출 시각을 확인할 수 있으며,
                이전 답안은 드롭다운을 펼쳐 확인할 수 있습니다.
            </div>

        </form>

        <div id="results" aria-live="polite">
            <p class="message">
                본인 정보를 입력한 뒤
                조회할 차시를 입력해 주세요.
            </p>
        </div>

    </div>
</div>

<script>
    /*
     * 1. 기존 Apps Script 주소
     * mode=worksheet 지원 버전 사용
     */
    const scriptURL =
        "https://script.google.com/macros/s/AKfycby6UxXYETf0rDuHPyqwY6YDCCEGZpH4lSNnD5tsj1ThC7TEIVcH97aSYjDqbp3gC9uf/exec";


    /*
     * 2. 비밀번호 보기/숨기기
     */
    function togglePassword() {
        const pw = document.getElementById('pw');
        const btn = document.querySelector('.toggle-pw');

        pw.type = pw.type === 'password'
            ? 'text'
            : 'password';

        btn.textContent = pw.type === 'password'
            ? '👁️'
            : '🙈';

        btn.setAttribute(
            'aria-label',
            pw.type === 'password'
                ? '비밀번호 보이기'
                : '비밀번호 숨기기'
        );
    }


    /*
     * 3. 입력 제한
     */
    document.getElementById('name')
        .addEventListener('input', function() {
            this.value = this.value.replace(
                /[^ㄱ-ㅎㅏ-ㅣ가-힣]/g,
                ''
            );
        });

    document.getElementById('pw')
        .addEventListener('input', function() {
            this.value = this.value.replace(
                /[^a-z0-9]/g,
                ''
            );
        });


    /*
     * 4. 조회 폼 제출
     */
    document.getElementById('searchForm')
        .addEventListener('submit', function(event) {
            event.preventDefault();
            searchData();
        });


    /*
     * 5. 문항 번호 정규화
     */
    function normalizeQuestionNo(value) {
        const text = String(value ?? '').trim();

        return /^\d+$/.test(text)
            ? String(Number(text))
            : text;
    }


    /*
     * 6. 제출 시각 표시
     * ISO 타임스탬프를 한국 시간으로 출력
     */
    function formatTimestamp(value) {
        if (!value) {
            return '제출 시각 정보 없음';
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return String(value);
        }

        return new Intl.DateTimeFormat('ko-KR', {
            timeZone: 'Asia/Seoul',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hourCycle: 'h23'
        }).format(date);
    }


    /*
     * 7. HTML 요소 생성
     * 학생 답안은 textContent로 표시
     */
    function createElement(tag, className, text) {
        const element = document.createElement(tag);

        if (className) {
            element.className = className;
        }

        if (text !== undefined) {
            element.textContent = text;
        }

        return element;
    }


    /*
     * 8. 안내 메시지 표시
     */
    function showMessage(message, isError = false) {
        const root = document.getElementById('results');
        root.replaceChildren();

        root.appendChild(createElement(
            'p',
            isError ? 'message error' : 'message',
            message
        ));
    }


    /*
     * 9. Apps Script 조회
     * 질문 + 최신 답안 + 이전 답안 수신
     */
    async function searchData() {
        const button = document.getElementById('searchButton');

        const period = document.getElementById('period')
            .value.trim();

        const params = new URLSearchParams({
            mode: 'worksheet',
            class: document.getElementById('class').value.trim(),
            num: document.getElementById('num').value.trim(),
            name: document.getElementById('name').value.trim(),
            pw: document.getElementById('pw').value.trim(),
            period: period
        });

        showMessage('활동지를 불러오는 중입니다... 🔍');
        button.disabled = true;

        try {
            const response = await fetch(
                scriptURL + '?' + params.toString(),
                { cache: 'no-store' }
            );

            if (!response.ok) {
                throw new Error('서버 응답 오류');
            }

            const data = await response.json();

            /*
             * 서버 오류 / 본인 확인 실패
             */
            if (
                !data ||
                typeof data !== 'object' ||
                data.ok !== true
            ) {
                if (Array.isArray(data)) {
                    showMessage(
                        'Apps Script가 이전 버전으로 실행 중입니다.\n' +
                        '새 코드로 배포했는지 확인해 주세요.',
                        true
                    );
                    return;
                }

                showMessage(
                    data && data.message
                        ? data.message
                        : '조회에 실패했습니다.',
                    true
                );
                return;
            }

            /*
             * 응답 구조 확인
             */
            if (
                !Array.isArray(data.questions) ||
                !Array.isArray(data.answers)
            ) {
                showMessage(
                    '질문과 답안 데이터를 정상적으로 받지 못했습니다.',
                    true
                );
                return;
            }

            /*
             * 완성 활동지 표시
             */
            renderWorksheet(
                period,
                data.questions,
                data.answers
            );

        } catch (error) {
            console.error('조회 오류:', error);

            showMessage(
                '조회 서버에 연결하지 못했습니다.\n' +
                '인터넷 연결과 Apps Script 배포 상태를 확인해 주세요.',
                true
            );

        } finally {
            button.disabled = false;
        }
    }


    /*
     * 10. 질문 번호 정렬
     */
    function compareQuestionNo(a, b) {
        const aText = String(a);
        const bText = String(b);

        const na = Number(aText);
        const nb = Number(bText);

        if (
            aText !== '' &&
            bText !== '' &&
            Number.isFinite(na) &&
            Number.isFinite(nb)
        ) {
            return na - nb;
        }

        return aText.localeCompare(
            bText,
            'ko',
            { numeric: true }
        );
    }


    /*
     * 11. 완성 활동지 생성
     */
    function renderWorksheet(period, questions, answers) {
        const root = document.getElementById('results');
        root.replaceChildren();

        const answerMap = new Map();

        answers.forEach(item => {
            const key = normalizeQuestionNo(item.questionNo);

            if (!key) return;

            answerMap.set(key, item);
        });

        const registered = new Set(
            questions.map(item =>
                normalizeQuestionNo(item.questionNo)
            )
        );

        const completed = questions.filter(item => {
            const key = normalizeQuestionNo(item.questionNo);
            return answerMap.has(key);
        }).length;

        const missing = questions.length - completed;

        /*
         * 제출 현황
         */
        const summary = createElement('div', 'summary-box');

        summary.appendChild(createElement(
            'div',
            'summary-title',
            period + '차시 완성 활동지'
        ));

        summary.appendChild(createElement(
            'div',
            'summary-count',
            '전체 문항: ' + questions.length + '개\n' +
            '답안 제출 문항: ' + completed + '개\n' +
            '미제출 문항: ' + missing + '개'
        ));

        root.appendChild(summary);

        /*
         * 해당 차시에 질문이 없는 경우
         */
        if (questions.length === 0) {
            root.appendChild(createElement(
                'p',
                'message',
                '해당 차시에 등록된 질문이 없습니다.'
            ));
        }

        /*
         * 질문 시트 문항을 기준으로 출력
         */
        questions.forEach(item => {
            const number = normalizeQuestionNo(
                item.questionNo
            );

            const question = String(item.question ?? '');

            const record = answerMap.get(number) || null;

            addQuestionCard(
                root,
                number,
                question,
                record,
                false
            );
        });

        /*
         * 질문 시트에 없는 번호로 제출한 답안
         */
        const unknown = [...answerMap.entries()]
            .filter(([key]) => !registered.has(key))
            .sort((a, b) =>
                compareQuestionNo(a[0], b[0])
            );

        if (unknown.length > 0) {
            const heading = createElement(
                'h3',
                '',
                '⚠ 질문 목록에 없는 번호로 제출된 답안'
            );

            heading.style.color = '#bd3333';
            root.appendChild(heading);

            unknown.forEach(([number, record]) => {
                addQuestionCard(
                    root,
                    number,
                    '현재 질문 시트에 등록되지 않은 문항 번호입니다.',
                    record,
                    true
                );
            });
        }
    }


    /*
     * 12. 질문 카드 생성
     * 질문 / 최신 답안 / 타임스탬프 / 이전 이력
     */
    function addQuestionCard(
        root,
        number,
        question,
        record,
        unregistered
    ) {
        const card = createElement('section', 'result-item');

        /*
         * 질문 번호
         */
        card.appendChild(createElement(
            'div',
            'q-no',
            '📌 ' + number + '번 질문'
        ));

        /*
         * 질문 원문
         */
        card.appendChild(createElement(
            'div',
            'question-text',
            question
        ));

        /*
         * 답안 헤더와 제출 상태
         */
        const header = createElement('div', 'answer-header');

        header.appendChild(createElement(
            'span',
            'answer-label',
            '현재 최신 답안'
        ));

        const status = createElement('span', 'status');

        if (!record) {
            status.classList.add('missing');
            status.textContent = '미제출';

        } else if (unregistered) {
            status.classList.add('warning');
            status.textContent = '문항 번호 확인 필요';

        } else {
            status.classList.add('complete');
            status.textContent = '제출 완료';
        }

        header.appendChild(status);
        card.appendChild(header);

        /*
         * 최신 답안
         */
        const answer = createElement(
            'div',
            'answer-content',
            record
                ? String(record.content ?? '') || '(빈 답안)'
                : '현재 제출된 답안이 없습니다.'
        );

        if (!record) {
            answer.classList.add('empty');
        }

        card.appendChild(answer);

        /*
         * 최종 제출 시각
         */
        if (record) {
            card.appendChild(createElement(
                'div',
                'submit-time',
                '🕒 최종 제출: ' +
                formatTimestamp(record.timestamp)
            ));
        }

        /*
         * 이전 답안 드롭다운
         * 이력이 있을 때만 생성
         */
        if (
            record &&
            Array.isArray(record.history) &&
            record.history.length > 0
        ) {
            const details = createElement(
                'details',
                'history-details'
            );

            const summary = createElement(
                'summary',
                '',
                '📂 이전 답안 보기 (' +
                record.history.length + '건)'
            );

            details.appendChild(summary);

            const historyList = createElement(
                'div',
                'history-list'
            );

            /*
             * 이전 답안을 최신순으로 표시
             */
            record.history.forEach(oldRecord => {
                const item = createElement(
                    'div',
                    'history-item'
                );

                item.appendChild(createElement(
                    'div',
                    'history-date',
                    '🕒 ' +
                    formatTimestamp(oldRecord.timestamp)
                ));

                item.appendChild(createElement(
                    'div',
                    'history-content',
                    String(oldRecord.content ?? '') ||
                    '(빈 답안)'
                ));

                historyList.appendChild(item);
            });

            details.appendChild(historyList);
            card.appendChild(details);
        }

        root.appendChild(card);
    }

</script>

</body>
</html>
