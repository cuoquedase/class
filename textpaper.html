
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 활동지 - 제출</title>

    <style>
        /* 나눔스퀘어라운드 웹폰트 */
        @import url("https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css");

        :root {
            --input-height: 36px;
            --border-color: #000;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'NanumSquareRound', sans-serif;
            font-weight: 400;
            overflow: hidden;
        }

        button, input, textarea {
            font-family: 'NanumSquareRound', sans-serif;
        }

        .main-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        /* 왼쪽: 학습지 영역 */
        .worksheet-area {
            flex: 1.2;
            min-width: 0;
            border-right: 3px solid var(--border-color);
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
        }

        .worksheet-area iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 오른쪽: 입력 영역 */
        .input-area {
            flex: 0.8;
            min-width: 0;
            padding: 25px;
            overflow-y: auto;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* 완성 활동지 조회 버튼 */
        .nav-btn {
            align-self: flex-end;
            padding: 10px 16px;
            background-color: #fffdec;
            border: 2px solid #000;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0 #000;
            margin-bottom: 10px;
        }

        .nav-btn:hover {
            background-color: #f0f0f0;
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #000;
        }

        /* 페이지 제목 */
        h1 {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 20px;
        }

        /* 입력 카드 */
        .input-box {
            background: #ffffff;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 6px 6px 0 var(--border-color);
            margin-bottom: 25px;
        }

        .box-title {
            display: block;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        /* 입력 항목 가로 배치 */
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 15px;
            align-items: center;
        }

        .input-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .unit {
            font-size: 0.92rem;
            font-weight: 700;
            white-space: nowrap;
        }

        /* 입력창 공통 */
        input {
            height: var(--input-height);
            padding: 0 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
        }

        input[type="number"].narrow {
            width: 65px;
        }

        input[type="text"].medium {
            width: 130px;
        }

        input:focus,
        textarea:focus {
            border-color: #000;
            background-color: #fffdec;
            outline: none;
        }

        /* 비밀번호 입력창 */
        #password {
            width: 200px;
            padding-right: 65px;
        }

        .pw-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .btn-toggle {
            position: absolute;
            right: 4px;
            height: 27px;
            padding: 0 8px;
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .btn-toggle:hover {
            background: #ddd;
        }

        /* 답안 작성 영역 */
        textarea {
            display: block;
            width: 100%;
            height: 240px;
            padding: 14px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.85;
            resize: none;
            overflow-wrap: anywhere;
        }

        textarea::placeholder {
            color: #999;
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            height: 50px;
            background-color: var(--border-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 800;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
        }

        /* 모바일 화면 */
        @media (max-width: 850px) {
            html, body {
                overflow: auto;
            }

            .main-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .worksheet-area {
                flex: none;
                height: 35vh;
                border-right: none;
                border-bottom: 3px solid #000;
            }

            .input-area {
                flex: none;
                overflow: visible;
                padding: 18px;
            }
        }

        @media (max-width: 380px) {
            .input-box {
                padding: 15px;
            }

            .flex-row {
                gap: 10px;
            }

            #password {
                width: 185px;
            }

            h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

<body>

<div class="main-container">

    <!-- 왼쪽: 기존 학습지 원문 -->
    <div class="worksheet-area">
        <iframe
            title="2학년 활동지"
            src="https://docs.google.com/document/d/e/2PACX-1vS0fvhPPwZcCbgQAXvjjTEv7R6ds_h5-HLgN9y0tS7w5RGDtWe8ZzWaBtSTCMBJBKU2-42iVqq9nlo7/pub?embedded=true">
        </iframe>
    </div>

    <!-- 오른쪽: 활동지 제출 화면 -->
    <div class="input-area">

        <!-- 완성 활동지 조회 페이지 -->
        <button
            type="button"
            class="nav-btn"
            onclick="location.href='search3.html'">
            📚 나의 완성 활동지 조회하기
        </button>

        <h1>✏️ 2학년 활동지 제출</h1>

        <!-- 구글 설문 제출 -->
        <form
            action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSfWWcpr7MJyAn6mWaoL2LUGqR-hLFgqxjONQzWAxkxHCuDmiw/formResponse"
            target="result"
            method="post"
            onsubmit="return numberCheck()">

            <!-- 본인 확인 -->
            <div class="input-box">

                <span class="box-title">👤 본인 확인</span>

                <div class="flex-row">

                    <!-- 학반 -->
                    <div class="input-item">
                        <input
                            type="number"
                            name="entry.575609189"
                            class="narrow"
                            placeholder="반"
                            aria-label="학반"
                            required>

                        <span class="unit">반</span>
                    </div>

                    <!-- 번호 -->
                    <div class="input-item">
                        <input
                            type="number"
                            name="entry.1986804342"
                            class="narrow"
                            placeholder="번"
                            aria-label="번호"
                            required>

                        <span class="unit">번</span>
                    </div>

                    <!-- 이름 -->
                    <input
                        type="text"
                        name="entry.1440774959"
                        class="medium"
                        placeholder="이름"
                        id="nameInput"
                        aria-label="이름"
                        required
                        pattern="^[ㄱ-ㅎㅏ-ㅣ가-힣]+$"
                        title="한글만 입력 가능합니다.">

                    <!-- 비밀번호 -->
                    <div class="pw-wrapper">

                        <input
                            type="password"
                            name="entry.1373887942"
                            class="medium"
                            placeholder="비밀번호"
                            id="password"
                            aria-label="비밀번호"
                            required
                            pattern="^[a-z0-9]+$"
                            title="영문 소문자와 숫자만 가능합니다.">

                        <button
                            type="button"
                            id="showPassword"
                            class="btn-toggle">
                            보이기
                        </button>

                    </div>

                </div>
            </div>

            <!-- 활동 내용 작성 -->
            <div class="input-box">

                <span class="box-title">📝 활동 내용 작성</span>

                <div class="flex-row">

                    <!-- 차시 -->
                    <div class="input-item">
                        <input
                            type="number"
                            name="entry.1913475540"
                            class="narrow"
                            aria-label="차시"
                            required>

                        <span class="unit">차시</span>
                    </div>

                    <!-- 질문 번호 -->
                    <div class="input-item">
                        <input
                            type="number"
                            name="entry.1403681020"
                            class="narrow"
                            aria-label="질문 번호"
                            required>

                        <span class="unit">번 질문</span>
                    </div>

                </div>

                <!-- 답변 내용 -->
                <textarea
                    name="entry.1653996263"
                    placeholder="여기에 답변 내용을 정성껏 입력하세요."
                    aria-label="답변 내용"
                    required></textarea>

                <!-- 제출 버튼 -->
                <input
                    type="submit"
                    value="활동지 제출하기"
                    class="submit-btn">

            </div>

            <!-- 기존 Google Forms 제출용 iframe -->
            <iframe
                name="result"
                title="제출 결과"
                style="display: none;">
            </iframe>

        </form>

    </div>
</div>

<script>

    /*
     * 1. 이름 입력 제한
     *
     * 한글 자음, 모음, 완성형만 허용
     */
    document.getElementById('nameInput')
        .addEventListener('input', function() {

            const start = this.selectionStart;
            const end = this.selectionEnd;

            const original = this.value;

            const filtered = original.replace(
                /[^ㄱ-ㅎㅏ-ㅣ가-힣]/g,
                ''
            );

            if (original !== filtered) {
                this.value = filtered;

                this.setSelectionRange(
                    Math.max(0, start - 1),
                    Math.max(0, end - 1)
                );
            }
        });


    /*
     * 2. 비밀번호 입력 제한
     *
     * 영문 소문자와 숫자만 허용
     */
    document.getElementById('password')
        .addEventListener('input', function() {

            const start = this.selectionStart;
            const end = this.selectionEnd;

            const original = this.value;

            const filtered = original.replace(
                /[^a-z0-9]/g,
                ''
            );

            if (original !== filtered) {
                this.value = filtered;

                this.setSelectionRange(
                    Math.max(0, start - 1),
                    Math.max(0, end - 1)
                );
            }
        });


    /*
     * 3. 제출 전 입력값 검사
     *
     * 기존 구글 설문 제출 방식 유지
     */
    function numberCheck() {
        const form = document.querySelector('form');

        const inputs = form.querySelectorAll(
            'input[required], textarea[required]'
        );

        let valid = true;

        inputs.forEach(function(input) {
            if (!input.checkValidity()) {
                valid = false;
            }
        });

        if (!valid) {
            alert(
                "입력 형식을 다시 확인해 주세요.\n" +
                "- 이름: 한글만 가능\n" +
                "- 비밀번호: 영문 소문자/숫자만 가능"
            );

            return false;
        }

        /*
         * 제출 확인
         */
        if (confirm("제출하시겠습니까?")) {

            // 전송을 시작하는 시점이므로
            // 서버의 저장 완료 여부와 구분
            alert("제출 요청을 전송합니다.");

            /*
             * 기존처럼 답변과 질문 번호만 초기화
             *
             * 학반, 번호, 이름, 비밀번호,
             * 차시는 그대로 유지
             */
            setTimeout(function() {

                document.querySelector(
                    'textarea[name="entry.1653996263"]'
                ).value = '';

                document.querySelector(
                    'input[name="entry.1403681020"]'
                ).value = '';

            }, 1000);

            return true;
        }

        return false;
    }


    /*
     * 4. 비밀번호 보기 / 숨기기
     */
    document.getElementById('showPassword')
        .addEventListener('click', function() {

            const pw = document.getElementById('password');

            pw.type = pw.type === 'password'
                ? 'text'
                : 'password';

            this.textContent = pw.type === 'password'
                ? '보이기'
                : '숨기기';
        });

</script>

</body>
</html>
